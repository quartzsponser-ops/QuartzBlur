name: Build QuartzBlur Installer

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Generate app icon
        run: python generate_icon.py
        shell: pwsh

      - name: Download FFmpeg for Windows
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_extracted
          $ffmpegDir = Get-ChildItem -Path ffmpeg_extracted -Directory | Select-Object -First 1
          Copy-Item "$($ffmpegDir.FullName)\bin\ffmpeg.exe" -Destination "ffmpeg.exe"
          Copy-Item "$($ffmpegDir.FullName)\bin\ffprobe.exe" -Destination "ffprobe.exe"
        shell: pwsh

      - name: Build .exe with PyInstaller
        run: |
          pyinstaller `
            --onefile `
            --windowed `
            --name "QuartzBlur" `
            --add-binary "ffmpeg.exe;." `
            --add-binary "ffprobe.exe;." `
            --icon "assets/icon.ico" `
            --add-data "assets;assets" `
            main.py
        shell: pwsh

      - name: Download & install Inno Setup
        run: |
          Invoke-WebRequest -Uri "https://jrsoftware.org/download.php/is.exe" -OutFile innosetup.exe
          Start-Process -Wait -FilePath innosetup.exe -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES"
        shell: pwsh

      - name: Create Inno Setup script
        run: |
          @"
          [Setup]
          AppName=QuartzBlur
          AppVersion=1.0
          AppPublisher=QuartzBlur
          DefaultDirName={autopf}\QuartzBlur
          DefaultGroupName=QuartzBlur
          OutputDir=installer
          OutputBaseFilename=QuartzBlur_Setup
          Compression=lzma
          SolidCompression=yes
          WizardStyle=modern

          [Languages]
          Name: "english"; MessagesFile: "compiler:Default.isl"

          [Tasks]
          Name: "desktopicon"; Description: "{cm:CreateDesktopIcon}"; GroupDescription: "{cm:AdditionalIcons}"

          [Files]
          Source: "dist\QuartzBlur.exe"; DestDir: "{app}"; Flags: ignoreversion

          [Icons]
          Name: "{group}\QuartzBlur"; Filename: "{app}\QuartzBlur.exe"
          Name: "{autodesktop}\QuartzBlur"; Filename: "{app}\QuartzBlur.exe"; Tasks: desktopicon

          [Run]
          Filename: "{app}\QuartzBlur.exe"; Description: "{cm:LaunchProgram,QuartzBlur}"; Flags: nowait postinstall skipifsilent
          "@ | Out-File -FilePath setup.iss -Encoding ASCII
        shell: pwsh

      - name: Compile Inno Setup installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss
        shell: pwsh

      - name: Upload standalone .exe
        uses: actions/upload-artifact@v4
        with:
          name: QuartzBlur-standalone-exe
          path: dist/QuartzBlur.exe

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: QuartzBlur-Installer
          path: installer/QuartzBlur_Setup.exe
